services:
  db:
    image: postgres:16-alpine
    container_name: etpi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etpi_dev}
      POSTGRES_DB: ${POSTGRES_DB:-etpi_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etpi} -d ${POSTGRES_DB:-etpi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: etpi_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-etpi}:${POSTGRES_PASSWORD:-etpi_dev}@db:5432/${POSTGRES_DB:-etpi_db}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
